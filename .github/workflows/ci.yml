name: Pull request

on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test app and worker
        run: npm test

      - name: Build
        env:
          GITHUB_PAGES: "true"
        run: npm run build

      - name: Install worker dependencies
        working-directory: worker
        run: npm ci

      - name: Typecheck worker
        working-directory: worker
        run: npx wrangler types && npx tsc --noEmit
